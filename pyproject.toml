[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ChromProcess"
version = "1.0.0"
description = "A library for processing chromatography data."
readme = "README.md"
requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [{ name = "William E. Robinson", email = "william.robinson@ru.nl" }]

maintainers = [
  { name = "William E. Robinson", email = "william.robinson@ru.nl" },
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "netcdf4"
]

[project.optional-dependencies]
dev = [
    "pdoc",
    "ruff",
    "mypy"
]

notebooks = [
    "notebook",
    "jupyterlab"
]

[project.urls]
"Source" = "https://github.com/Will-Robin/ChromProcess"
"Homepage" = "https://will-robin.github.io/ChromProcess/ChromProcess.html"
"Bug Reports" = "https://github.com/Will-Robin/ChromProcess/issues"
